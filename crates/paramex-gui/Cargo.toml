# crates/paramex-gui/Cargo.toml
[package]
name = "paramex-gui"
description = "ParamEx: Windows desktop app for TFT transfer-curve and TLM characterization"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "paramex-gui"
path = "src/main.rs"

[lib]
name = "paramex_gui"
path = "src/lib.rs"

[dependencies]
paramex-core = { path = "../paramex-core" }
eframe = "0.34"
egui = "0.34"
egui-notify = "0.22"
rfd = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
egui_extras = { version = "0.34", features = ["svg"] }
# egui_plot versions lead egui by one minor: 0.35 is the release built against egui 0.34.
egui_plot = "0.35"

# Windows-only build glue: embed the .exe resource icon. Gated so non-Windows
# builds don't fetch it; build.rs only references it under cfg(windows).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Windows-only OS glue (single-instance mutex + MessageBoxW). Gated so the
# crate still compiles and tests on non-Windows hosts.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# `wgpu` + `snapshot` let the integration tests render the real app headlessly to
# PNG so visual regressions are caught in CI rather than by a manual smoke test.
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot", "eframe"] }
# Names the image type `Harness::render` returns; the version tracks egui_kittest.
image = { version = "0.25", default-features = false }
