# crates/paramex-core/Cargo.toml
[package]
name = "paramex-core"
description = "GUI-free TFT characterization: transfer-curve and TLM parsing, fitting, and CSV export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
calamine = "0.35"
csv = "1.3"
indexmap = "2"
sha2 = "0.10"

[dev-dependencies]
rust_xlsxwriter = "0.95.0"
serde_json = { version = "1", features = ["float_roundtrip"] }
